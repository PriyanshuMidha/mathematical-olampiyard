<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Mathematical Olympiad news">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2"/></pattern>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1437" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <g fill="#fff" fill-opacity=".16" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="90" y="170" font-size="120">π</text><text x="1010" y="190" font-size="110">Σ</text>
    <text x="120" y="560" font-size="100">√x</text><text x="980" y="585" font-size="120">∞</text>
    <text x="300" y="110" font-size="60">a²+b²</text><text x="820" y="100" font-size="64">∫</text>
  </g>
  <g filter="url(#s)" transform="translate(330 180)">
    <rect width="540" height="330" rx="28" fill="#fff"/>
    <rect width="540" height="78" rx="28" fill="#dbeafe"/><rect y="50" width="540" height="28" fill="#dbeafe"/>
    <circle cx="44" cy="39" r="12" fill="#2563eb"/><circle cx="80" cy="39" r="12" fill="#60a5fa"/>
    <text x="500" y="52" text-anchor="end" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="30" fill="#1e3a8a" letter-spacing="4">NEWS</text>
    <rect x="40" y="112" width="300" height="24" rx="12" fill="#1e3a8a"/>
    <rect x="40" y="158" width="460" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="40" y="190" width="420" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="40" y="222" width="440" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="40" y="266" width="150" height="38" rx="19" fill="#2563eb"/>
    <g transform="translate(400 250)"><circle r="44" fill="#fbbf24"/><text y="20" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="58" fill="#7c2d12">π</text></g>
  </g>
  <text x="600" y="610" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="30" fill="#fff" fill-opacity=".9" letter-spacing="6">MATHEMATICAL OLYMPIAD · LATEST NEWS</text>
</svg>
