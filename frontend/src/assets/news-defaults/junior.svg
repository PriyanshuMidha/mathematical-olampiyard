<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Mathematical Olympiad junior level">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#064e3b"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#fff" fill-opacity=".09"/></pattern>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#022c22" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <g filter="url(#s)" font-family="Inter, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <g transform="translate(250 330) rotate(-8)"><path d="M0 -110 L105 75 H-105 Z" fill="#fde047"/><text y="45" font-size="80" fill="#854d0e">1</text></g>
    <g transform="translate(470 290)"><circle r="100" fill="#fff"/><text y="30" font-size="88" fill="#047857">2</text></g>
    <g transform="translate(700 330) rotate(7)"><rect x="-95" y="-95" width="190" height="190" rx="22" fill="#fb7185"/><text y="30" font-size="88" fill="#fff">3</text></g>
    <g transform="translate(930 290)"><path d="M0 -105 L100 -32 L62 85 H-62 L-100 -32 Z" fill="#60a5fa"/><text y="35" font-size="80" fill="#fff">4</text></g>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="900" font-size="54" text-anchor="middle" fill="#064e3b">
    <g transform="translate(150 130)"><circle r="38" fill="#a7f3d0"/><text y="19">+</text></g>
    <g transform="translate(1060 140)"><circle r="38" fill="#a7f3d0"/><text y="17">−</text></g>
    <g transform="translate(1070 520)"><circle r="38" fill="#a7f3d0"/><text y="19">×</text></g>
    <g transform="translate(130 520)"><circle r="38" fill="#a7f3d0"/><text y="19">÷</text></g>
  </g>
  <g transform="translate(360 470)">
    <rect width="480" height="12" rx="6" fill="#fff" fill-opacity=".55"/>
    <g fill="#fde047"><circle cx="40" cy="6" r="18"/><circle cx="84" cy="6" r="18"/><circle cx="128" cy="6" r="18"/></g>
    <g fill="#fff"><circle cx="300" cy="6" r="18"/><circle cx="344" cy="6" r="18"/></g>
    <g fill="#fb7185"><circle cx="400" cy="6" r="18"/><circle cx="444" cy="6" r="18"/></g>
  </g>
  <text x="600" y="610" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="30" fill="#fff" fill-opacity=".92" letter-spacing="6">MATHEMATICAL OLYMPIAD · JUNIOR</text>
</svg>
